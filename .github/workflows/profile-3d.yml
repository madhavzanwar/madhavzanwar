name: GitHub 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate 3d contribution calendar
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: generate github-contribution-grid
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: madhavzanwar

      - name: commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f ./profile-3d-contrib/*.svg
          git commit -m "generate 3d contribution calendar" || exit 0
          git pull --rebase
          git push
